server {
    listen 0.0.0.0:8081;
    server_name main_webserv;

    root ./www;
    index index.html;
    autoindex off;

    client_max_body_size 1000000000000;

    allowed_methods GET POST DELETE;

    error_page 400 ./www/errors/400.html;
    error_page 403 ./www/errors/403.html;
    error_page 404 ./www/errors/404.html;
    error_page 405 ./www/errors/405.html;
    error_page 413 ./www/errors/413.html;
    error_page 500 ./www/errors/500.html;
    error_page 501 ./www/errors/501.html;
    error_page 505 ./www/errors/505.html;

    location / {
        root ./www;
        index index.html;
        autoindex off;
        allowed_methods GET;
    }

    location /public {
        root ./www/public;
        index index.html;
        autoindex on;
        allowed_methods GET;
    }

    location /pictures {
        root ./www/tmp;
        index index.html;
        autoindex on;
        allowed_methods GET;
    }

    location /upload {
        allowed_methods POST;
        upload_path ./www/uploads;
    }

    location /uploads {
        root ./www/uploads;
        autoindex on;
        allowed_methods GET DELETE;
    }

    location /old {
        allowed_methods GET;
        return 301 /;
    }

    location /cgi-bin {
        root ./www/cgi-bin;
        index index.py;
        autoindex off;
        allowed_methods GET POST;
        cgi .py /usr/bin/python3;
    }

    
}

server {
    listen 0.0.0.0:8082;
    server_name secondary_webserv;

    root ./www2;
    index index.html;
    autoindex off;

    client_max_body_size 2000000;
    allowed_methods GET;

    location / {
        root ./www2;
        index index.html;
        autoindex off;
        allowed_methods GET;
    }
}
