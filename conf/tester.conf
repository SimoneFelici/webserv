server {
    listen 0.0.0.0:8081;
    server_name webserv_tester;
    root ./www;
    index index.html;
    client_max_body_size 100;

    error_page 400 ./www/errors/400.html;
    error_page 403 ./www/errors/403.html;
    error_page 404 ./www/errors/404.html;
    error_page 405 ./www/errors/405.html;
    error_page 413 ./www/errors/413.html;
    error_page 500 ./www/errors/500.html;

    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex off;
    }

    location /youpi.bla {
        methods POST;
        root ./www;
        cgi .bla /home/blue/Projects/webserv/www/cgi-bin/cgi_tester.cgi;
    }

    location /post_body {
        methods GET POST;
        root ./www;
        upload_path ./www/uploads;
    }

    location /directory {
        methods GET POST;
        root ./YoupiBanane;
        index youpi.bad_extension;
        autoindex off;
        cgi .bla /home/blue/Projects/webserv/www/cgi-bin/cgi_tester.cgi;
    }
}
