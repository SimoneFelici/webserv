server {
    listen 0.0.0.0:8081;
    server_name my_webserv;

    client_max_body_size 1000000;

    error_page 404 ./www/errors/404.html;
    error_page 500 ./www/errors/500.html;

    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex off;
    }

    location /public {
        methods GET;
        root ./www/public;
        index index.html;
        autoindex on;
    }
}
